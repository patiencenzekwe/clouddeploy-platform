services:
  database:
    image: postgres:18-alpine
    container_name: clouddeploy-db
    environment:
      POSTGRES_DB: clouddeploy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: clouddeploy-api
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: clouddeploy
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: clouddeploy-web
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
